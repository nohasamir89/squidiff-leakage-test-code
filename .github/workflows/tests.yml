# Continuous integration for the manuscript code package.
#
# Runs on every push and pull request, CPU only, in about two minutes:
#   1. lint   - ruff, restricted to rules that mean a crash or a certain bug
#               (undefined names, redefinitions, syntax errors, pylint errors,
#               removed numpy aliases). The broader bug-pattern rules are run
#               as an advisory report (they were triaged by hand on 21 Oct 2026
#               and found benign; see tests/README.md).
#   2. tests  - the pytest suite in tests/: statistical primitives vs scipy and
#               analytical values, figure values re-derived from the committed
#               records, and package integrity (MANIFEST sha256, compile,
#               import graph).
#
# Versions are the manuscript's (Methods, "Software and hardware"): Python 3.10,
# numpy 1.26.4, SciPy 1.15.3, pandas 2.3.3, scikit-learn 1.7.2, anndata 0.11.4.
# PyTorch is deliberately not installed: nothing in tests/ needs it, and the
# scorers are imported through the torch-free shim in tests/conftest.py.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install the pinned scientific stack
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==1.26.4" "scipy==1.15.3" "pandas==2.3.3" "scikit-learn==1.7.2" \
                      "anndata==0.11.4" "pytest>=8" "ruff>=0.6"

      - name: Lint (crash-class rules; must pass)
        run: ruff check --select F821,F811,F823,E9,PLE,NPY001 .

      - name: Lint (advisory bug-pattern report; never fails the build)
        run: ruff check --select F,B,NPY --statistics . || true

      - name: Tests
        run: python -m pytest -q

      - name: Optional slow checks (bootstrap coverage simulation)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python -m pytest -q -m slow
